manifest:
  remotes:
    - name: simpleiot
      url-base: https://github.com/simpleiot
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - hal_espressif
          - hal_stm32
          - hal_rpi_pico
          - cmsis
          - cmsis_6
          - mbedtls
          - picolibc
          - fatfs
    - name: zephyr-snmp
      remote: simpleiot
      revision: main
      path: modules/lib/snmp
    - name: module-sample
      url: https://github.com/yashi/module-sample
      revision: main
      path: modules/lib/sample
    - name: west-debug-tools
      revision: main
      url: https://github.com/hasheddan/west-debug-tools
      west-commands: west-commands.yml
  self:
    path: siot
