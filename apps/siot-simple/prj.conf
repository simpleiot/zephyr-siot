# siot-simple: minimal app exercising lib siot + ZMS over a serial shell.
# No networking -- this is a storage/zbus smoke-test target.

# Serial console + shell
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_ASSERT=y

# lib siot. Selects (no need to set explicitly): JSON_LIBRARY, ZBUS,
# ZBUS_RUNTIME_OBSERVERS, ZBUS_MSG_SUBSCRIBER, THREAD_MONITOR,
# THREAD_RUNTIME_STATS, FLASH, FLASH_PAGE_LAYOUT, ZMS.
CONFIG_LIB_SIOT=y

# lib/nvs.c uses a zbus message subscriber; give it a dynamic buffer pool.
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_DYNAMIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16
CONFIG_ZBUS_CHANNEL_NAME=y

# lib/metrics.c reports CPU usage; needs scheduler usage tracking and
# float printf.
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
