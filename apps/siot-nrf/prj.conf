# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=8192
# cloud_publish() runs on the main thread and carries the HTTP client state and
# receive buffer on its stack. Measure with "kernel thread stacks" and trim once
# the publish path is proven.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Report per-thread stack usage via the "kernel thread stacks" shell command
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# New Libc
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
# POSIX_API replaces NET_SOCKETS_POSIX_NAMES (removed in Zephyr 4.x) and
# exposes unprefixed BSD socket names like connect/socket/getaddrinfo.
CONFIG_POSIX_API=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_STATISTICS=y
# CONFIG_NET_ICMPV4=y
# CONFIG_NET_PKT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y 

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# PSM enablez (LTE_LC_PSM_MODULE gates the PSM submodule in NCS v3.x)
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00100110" # 6 hour
CONFIG_LTE_PSM_REQ_RAT="00000011" # 6 sec active time

# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_MODEM_KEY_MGMT=y

# Date Time library
CONFIG_DATE_TIME=y

# Logging
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# Deferred logging copies string arguments into this buffer. The default of 1024
# is too small for the HTTP response body, which is dropped rather than
# truncated when it does not fit.
CONFIG_LOG_BUFFER_SIZE=4096

# cJSON
CONFIG_CJSON_LIB=y

# HTTP
CONFIG_HTTP_CLIENT=y

# Debug
# CONFIG_ASSERT=y
# CONFIG_RESET_ON_FATAL_ERROR=n

# Cloud endpoint
#
# Defaults to postman-echo.com, a public request-echo service, so the publish
# path can be exercised without standing up a server. It echoes the request back
# as JSON, so a successful publish is visible in the device log. It also chains
# to ISRG Root X1, the CA provisioned to the modem in src/cloud/isrg-root-x1.pem.
#
# Point these at a real endpoint for anything beyond bring-up. Note the CA must
# match: a server with a certificate from a different root needs its own root
# swapped into isrg-root-x1.pem.
CONFIG_CLOUD_HOSTNAME="postman-echo.com"
CONFIG_CLOUD_PUBLISH_PATH="/post"
CONFIG_CLOUD_PORT=443

# Shell
CONFIG_SHELL=y
CONFIG_AT_SHELL=y
# The shell treats ? and * as glob characters, which strips the argument from
# AT read commands such as "at AT+CEREG?" before at_shell() sees it.
CONFIG_SHELL_WILDCARD=n
# CONFIG_NET_SHELL=y
