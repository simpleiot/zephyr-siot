CONFIG_ZBUS_LOG_LEVEL_INF=y
CONFIG_ZBUS_CHANNEL_NAME=y
# Message subscriber buffers come from a fixed pool rather than the heap. Every
# publish to a channel with message subscribers allocates a buffer, and with the
# dynamic allocator that came out of the 2 KB zbus heap. At 80 bytes for a
# point, the heap held roughly 20 messages in flight regardless of the pool
# count, and once it was exhausted the allocation returned NULL, which zbus
# asserts on. A fixed pool makes the capacity what it says it is and takes the
# heap out of the publish path.
#
# STATIC_DATA_SIZE must be at least the largest message on any channel, which is
# sizeof(point) at 80 bytes. 96 leaves room for the struct to grow.
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=96
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=48

CONFIG_LIB_SIOT=y

CONFIG_REQUIRES_FLOAT_PRINTF=y


# Point cache and shell point streaming. The shell protocol lets a host
# running Simple IoT exchange points over the console UART, which on the
# Nucleo-H743ZI is the ST-LINK virtual COM port.
CONFIG_SIOT_POINT_CACHE=y
CONFIG_SIOT_POINT_SHELL=y
# The shell print buffer defaults to 30 bytes, which chunks every emitted
# point line into several UART flushes.
CONFIG_SHELL_PRINTF_BUFF_SIZE=128
